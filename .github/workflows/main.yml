# CodeQL analysis for C++ with explicit modern toolchain setup (GCC 14)
# Triggers: push, pull_request, weekly schedule, and manual workflow_dispatch
name: "CodeQL"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: "0 3 * * 0" # weekly on Sunday at 03:00 UTC
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ "cpp" ]

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up apt repositories and install system dependencies
        run: |
          sudo apt-get update
          # Install development packages needed by the project and for Vulkan/GLFW
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config curl ca-certificates \
            libglfw3-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libvulkan-dev vulkan-utils vulkan-headers \
            clang-17 libc++-17-dev libc++abi-17-dev \
            # add any other dev packages your project needs (e.g., libxcb-*, X11 devs, etc.)
            || true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Build (explicit CMake build using GCC 14)
        env:
          CC: clang-17
          CXX: clang++-17
        run: |
          set -euo pipefail
          mkdir -p build
          # Force CMake to use clang-17 and request C++23. Adjust flags as needed for your project.
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-17 \
            -DCMAKE_CXX_COMPILER=clang++-17 \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF
          cmake --build build -- -j$(nproc)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "security-and-quality"
