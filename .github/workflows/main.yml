name: "CodeQL"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ "cpp" ]

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          # ensure submodules used by your CMake are checked out
          submodules: 'recursive'
          fetch-depth: 0

      - name: Initialize CodeQL (v3)
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          queries: security-and-quality

      # Optional: try autobuild (updated to v3). Keep it, but also add an explicit build step below.
      - name: Attempt autobuild (v3, recommended but optional)
        uses: github/codeql-action/autobuild@v3

      # Explicit build step (recommended when autobuild fails). Adjust as needed.
      - name: Build (explicit CMake)
        if: ${{ always() }}
        run: |
          # make sure submodules are initialized (redundant if checkout did it)
          git submodule update --init --recursive

          # Typical CMake build — change flags/paths as your project requires
          mkdir -p build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -- -j$(nproc)

      - name: Perform CodeQL Analysis (v3)
        uses: github/codeql-action/analyze@v3
        with:
          category: "security-and-quality"
