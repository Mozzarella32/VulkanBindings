# CodeQL analysis (C++): explicit clang build to use libc++/clang++ for C++23 features
name: "CodeQL (clang build)"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: "0 3 * * 0" # weekly on Sunday at 03:00 UTC
  workflow_dispatch:

jobs:
  analyze:
    name: CodeQL Analysis (clang)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ "cpp" ]

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Install clang and libc++ (apt)
        run: |
          sudo apt-get update
          # install clang and libc++ dev packages so we can use libc++
          sudo apt-get install -y clang libc++-dev libc++abi-dev
        # note: on ubuntu-latest clang is usually available already, but we install libc++ dev packages to be explicit

      - name: Configure and build with clang/clang++ and libc++
        env:
          CC: clang
          CXX: clang++
        run: |
          set -euo pipefail
          mkdir -p build
          # Tell CMake to use clang/clang++ and prefer libc++
          cmake -S . -B build \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++ -std=gnu++23"
          cmake --build build -- -j$(nproc)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "security-and-quality"
