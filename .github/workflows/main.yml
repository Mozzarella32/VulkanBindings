# CodeQL analysis for C++ (explicit build using clang+libc++)
name: "CodeQL"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: "0 3 * * 0" # weekly on Sunday at 03:00 UTC
  workflow_dispatch:

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ "cpp" ]

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # install clang + libc++ and typical build deps, plus Vulkan and GLFW dev packages
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential cmake make pkg-config \
            clang libc++-dev libc++abi-dev \
            libvulkan-dev vulkan-utils libglfw3-dev \
            glslang-tools

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      # Explicit build (clang + libc++) — replace or adjust flags if your project requires different options
      - name: Configure & build (clang + libc++)
        env:
          CC: clang
          CXX: clang++
        run: |
          mkdir -p build
          # Force CMake to use clang and libc++, request C++23 standard
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++" \
            -DCMAKE_SHARED_LINKER_FLAGS="-stdlib=libc++"
          cmake --build build -- -j$(nproc)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "security-and-quality"
